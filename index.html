    <script>
      (() => {
        if (window.__pkmLiteHudMounted) return
        window.__pkmLiteHudMounted = true

        const hud = document.createElement('aside')
        hud.setAttribute('aria-label', 'System HUD')
        hud.style.position = 'fixed'
        hud.style.right = '16px'
        hud.style.top = '16px'
        hud.style.zIndex = '70'
        hud.style.width = '220px'
        hud.style.padding = '10px 12px'
        hud.style.border = '1px solid rgba(56, 189, 248, 0.35)'
        hud.style.borderRadius = '12px'
        hud.style.background = 'rgba(2, 6, 23, 0.82)'
        hud.style.backdropFilter = 'blur(8px)'
        hud.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
        hud.style.fontSize = '11px'
        hud.style.lineHeight = '1.5'
        hud.style.color = 'rgba(186, 230, 253, 0.95)'
        hud.style.pointerEvents = 'none'

        const title = document.createElement('div')
        title.textContent = 'SYSTEM HUD'
        title.style.fontWeight = '700'
        title.style.letterSpacing = '0.08em'
        title.style.marginBottom = '6px'
        title.style.color = 'rgba(125, 211, 252, 1)'

        const body = document.createElement('div')
        body.style.whiteSpace = 'pre-line'
        body.textContent = 'Loading telemetry...'

        hud.appendChild(title)
        hud.appendChild(body)
        document.body.appendChild(hud)

        let frameCount = 0
        let lastFrameTime = performance.now()
        let fps = 0

        const rafLoop = () => {
          frameCount += 1
          const now = performance.now()
          if (now - lastFrameTime >= 1000) {
            fps = Math.round((frameCount * 1000) / (now - lastFrameTime))
            frameCount = 0
            lastFrameTime = now
          }
          requestAnimationFrame(rafLoop)
        }
        requestAnimationFrame(rafLoop)

        const pickValue = (label) => {
          const match = document.body.innerText.match(new RegExp(`${label}\\s*:\\s*([^\\n]+)`))
          return match ? match[1].trim() : 'N/A'
        }

        const updateHud = () => {
          body.textContent = [
            `Node: ${pickValue('ACTIVE NODE')}`,
            `Mode: ${pickValue('CURRENT MODE')}`,
            `Uptime: ${pickValue('UPTIME')}`,
            `FPS: ${fps || 'N/A'}`,
          ].join('\n')
        }

        updateHud()
        setInterval(updateHud, 1200)
      })()
    </script>

    <script>
      (() => {
        if (window.__pkmTerminalButtonPatched) return
        window.__pkmTerminalButtonPatched = true

        const patchTerminalButton = () => {
          const terminalDiv = document.querySelector('[data-terminal]')
          if (!terminalDiv) return
          const headerDiv = terminalDiv.querySelector('div.mb-2.flex')
          if (!headerDiv) return
          const button = headerDiv.querySelector('button')
          if (!button || button.dataset.pkm) return
          button.dataset.pkm = '1'
          
          // Change button text to "Close Terminal"
          button.textContent = 'Close Terminal'
          button.style.fontSize = '10px'
          button.style.whiteSpace = 'nowrap'
          
          // Reorder: move button to left
          headerDiv.style.flexDirection = 'row-reverse'
          headerDiv.style.gap = '8px'
        }

        patchTerminalButton()
        const obs = new MutationObserver(patchTerminalButton)
        obs.observe(document.body, { childList: true, subtree: true })
      })()
    </script>

        /* â”€â”€ PREVIEW HTML â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        function buildPreview(p) {
          const bars = Array.from({length:10}).map(()=>'<div class="pkm-bar"></div>').join('')
          if (p.preview==='bars') return `
            <div class="pkm-preview-grid"></div>
            <span class="pkm-preview-lbl">${p.pvLabel}</span>
            <span class="pkm-preview-val" data-metric="${Math.floor(Math.random()*35+55)}">â€”</span>
            <div class="pkm-bars">${bars}</div>`
          if (p.preview==='pulse') return `
            <div class="pkm-preview-grid"></div>
            <span class="pkm-preview-lbl">${p.pvLabel}</span>
            <span class="pkm-preview-val">LIVE</span>
            <div class="pkm-pulse-wrap">
              <svg class="pkm-ecg-svg" viewBox="0 0 320 38" fill="none">
                <polyline stroke="${p.glow}" stroke-width="1.5" fill="none" opacity=".85" stroke-dasharray="600" class="pkm-ecg-path"
                  points="0,19 25,19 38,5 50,33 60,19 90,19 103,2 115,36 125,19 155,19 168,5 180,33 190,19 220,19 233,3 245,35 255,19 285,19 298,4 310,34 320,19"/>
              </svg>
            </div>
            <div class="pkm-pulse-dot" style="background:${p.glow};box-shadow:0 0 8px ${p.glow}"></div>`
          if (p.preview==='scan') {
            const dots = Array.from({length:14}).map(()=>{
              const x=(Math.random()*78+8).toFixed(1),y=(Math.random()*55+20).toFixed(1),d=(Math.random()*1.4).toFixed(2)
              return `<div class="pkm-scan-dot" style="left:${x}%;top:${y}%;animation-delay:${d}s;background:${p.glow};box-shadow:0 0 6px ${p.glow}"></div>`
            }).join('')
            return `
              <div class="pkm-preview-grid"></div>
              <span class="pkm-preview-lbl">${p.pvLabel}</span>
              <span class="pkm-preview-val">SCANNING</span>
              <div class="pkm-scan-area">${dots}<div class="pkm-scan-sweep" style="background:linear-gradient(to bottom,transparent,${p.glow}44,transparent)"></div></div>`
          }
          const flines = Array.from({length:4}).map((_,i)=>`<div class="pkm-flow-line" style="top:${20+i*18}%;width:${40+Math.random()*35}%;animation-delay:${(i*.45).toFixed(2)}s;background:linear-gradient(to right,${p.glow}88,transparent)"></div>`).join('')
          return `
            <div class="pkm-preview-grid"></div>
            <span class="pkm-preview-lbl">${p.pvLabel}</span>
            <span class="pkm-preview-val">ACTIVE</span>
            <div class="pkm-flow-area">${flines}</div>`
        }

        /* â”€â”€ CARD BUILDER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        function buildCard(p, i) {
          const art = document.createElement('article')
          art.className = 'pkm-project-card ' + p.anim + (p.featured ? ' pkm-featured' : '')
          art.style.cssText = '--cg:' + p.glow + ';--cgd:' + p.glowDim + ';'
          art.dataset.delay = String(i * 130)
          const hl = p.highlights.map(h => '<li>' + h + '</li>').join('')
          const chips = p.stack.map(t => '<span class="pkm-chip">' + t + '</span>').join('')
          art.innerHTML =
            '<div class="pkm-card-ambient"></div>' +
            '<div class="pkm-card-glass"></div>' +
            '<div class="pkm-hover-glow"></div>' +
            '<div class="pkm-card-border-sweep"></div>' +
            '<div class="pkm-card-content">' +
              '<div class="pkm-card-toprow">' +
                '<span class="pkm-card-idx">// ' + p.idx + '</span>' +
                '<span class="pkm-card-badge">' + p.domain + '</span>' +
              '</div>' +
              '<h3 class="pkm-card-title">' + p.title + '</h3>' +
              '<p class="pkm-card-stage">' + p.stage + '</p>' +
              '<div class="pkm-preview">' + buildPreview(p) + '</div>' +
              '<p class="pkm-card-summary">' + p.summary + '</p>' +
              '<ul class="pkm-hl">' + hl + '</ul>' +
              '<div class="pkm-chips">' + chips + '</div>' +
              '<button class="pkm-openbtn" type="button">Open System ' +
                '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5h6M5.5 2.5L8 5l-2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
              '</button>' +
            '</div>'
          art.addEventListener('mousemove', function(e) {
            const r = art.getBoundingClientRect()
            art.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%')
            art.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%')
          })
          art.querySelector('.pkm-openbtn').addEventListener('click', function(ev) { ev.stopPropagation(); openModal(p) })
          art.addEventListener('click', function() { openModal(p) })
          const mv = art.querySelector('[data-metric]')
          if (mv) {
            const tgt = parseInt(mv.dataset.metric); let cur = 0
            const tick = function() { cur = Math.min(cur + Math.ceil(tgt / 36), tgt); mv.textContent = cur + '%'; if (cur < tgt) requestAnimationFrame(tick) }
            setTimeout(tick, 900 + i * 130)
          }
          return art
        }

        /* â”€â”€ MODAL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        let _modal = null
        function ensureModal() {
          if (document.getElementById('pkm-modal')) { _modal = document.getElementById('pkm-modal'); return }
          _modal = document.createElement('div'); _modal.id = 'pkm-modal'
          _modal.innerHTML = '<div id="pkm-modal-bg"></div><div id="pkm-modal-box"><button id="pkm-modal-close" type="button" aria-label="Close">\u2715</button><div id="pkm-modal-body"></div></div>'
          document.body.appendChild(_modal)
          document.getElementById('pkm-modal-bg').addEventListener('click', closeModal)
          document.getElementById('pkm-modal-close').addEventListener('click', closeModal)
          document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal() })
        }
        function openModal(p) {
          ensureModal()
          document.getElementById('pkm-modal-box').style.borderColor = p.glow + '44'
          const hl = p.highlights.map(h => '<li>' + h + '</li>').join('')
          const chips = p.stack.map(t => '<span class="mm-chip" style="border-color:' + p.glow + '44;color:' + p.glow + ';background:' + p.glowDim + '">' + t + '</span>').join('')
          document.getElementById('pkm-modal-body').innerHTML =
            '<span class="mm-badge" style="border-color:' + p.glow + '44;color:' + p.glow + ';background:' + p.glowDim + '">' + p.domain + '</span>' +
            '<h2 class="mm-title">' + p.title + '</h2>' +
            '<p class="mm-stage">' + p.stage + '</p>' +
            '<div class="mm-div"></div>' +
            '<p class="mm-summary">' + p.summary + '</p>' +
            '<p class="mm-hl-label">System Capabilities</p>' +
            '<ul class="mm-hl" style="--mg:' + p.glow + '">' + hl + '</ul>' +
            '<div class="mm-chips">' + chips + '</div>'
          requestAnimationFrame(function() { requestAnimationFrame(function() { _modal.classList.add('open') }) })
          document.body.style.overflow = 'hidden'
        }
        function closeModal() {
          if (_modal) _modal.classList.remove('open')
          document.body.style.overflow = ''
        }

        /* â”€â”€ VISIBILITY GUARD â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        function forceProjectsVisible() {
          const section = document.getElementById('projects')
          if (section) {
            section.style.setProperty('opacity', '1', 'important')
            section.style.setProperty('transform', 'none', 'important')
          }
          document.querySelectorAll('.pkm-project-card').forEach(function(card) {
            card.style.setProperty('opacity', '1', 'important')
            card.style.setProperty('transform', 'none')
          })
        }

        /* â”€â”€ PATCH â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        let patched = false
        function applyPatch() {
          if (patched) return true
          const section = document.getElementById('projects')
          if (!section) return false
          const origCards = Array.from(section.querySelectorAll('article')).filter(function(a) { return !!a.querySelector('h3') })
          if (!origCards.length) return false
          patched = true
          origCards.forEach(function(a) { a.style.display = 'none' })
          /* Force section visible â€” Framer Motion may hold it at opacity:0 until its own observer fires */
          forceProjectsVisible()
          const old = section.querySelector('[data-pkm-grid]')
          if (old) old.remove()
          const grid = document.createElement('div')
          grid.setAttribute('data-pkm-grid', 'true')
          grid.className = 'pkm-projects-grid'
          portfolioProjects.forEach(function(p, i) { grid.appendChild(buildCard(p, i)) })
          section.appendChild(grid)
          ensureModal()
          const io = new IntersectionObserver(function(entries) {
            entries.forEach(function(e) {
              if (!e.isIntersecting) return
              const card = e.target, d = parseInt(card.dataset.delay || '0')
              setTimeout(function() { card.classList.add('pkm-on') }, d)
              io.unobserve(card)
            })
          }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' })
          const allCards = Array.from(grid.querySelectorAll('.pkm-project-card'))
          allCards.forEach(function(c) { io.observe(c) })
          /* Fallback: if observer never fires (cards already in viewport at mount), reveal after delay */
          setTimeout(function() {
            allCards.forEach(function(c) {
              if (!c.classList.contains('pkm-on')) {
                c.classList.add('pkm-on')
              }
            })
            forceProjectsVisible()
          }, 600)
          return true
        }

        /* â”€â”€ BOOT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        let tries = 0
        const t = setInterval(function() {
          tries++
          applyPatch()
          forceProjectsVisible()
          if (tries > 120) clearInterval(t)
        }, 250)
        window.addEventListener('load', function() {
          applyPatch()
          forceProjectsVisible()
        })
        new MutationObserver(function() {
          if (!patched) applyPatch()
          forceProjectsVisible()
        }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] })
      })()
    </script>

            z-index: 2;
            margin: 2px 12px 8px;
            border: 1px solid rgba(34, 211, 238, 0.14);
            border-radius: 10px;
            overflow: hidden;
            background: radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.1), rgba(2, 10, 24, 0.8));
          }
          #pkm-net-canvas {
            display: block;
            width: 100%;
            height: 88px;
          }

          .pkm-feed {
            position: relative;
            z-index: 2;
            margin: 0 12px 8px;
            border: 1px solid rgba(34, 211, 238, 0.14);
            border-radius: 10px;
            background: rgba(3, 15, 32, 0.6);
            overflow: hidden;
          }
          .pkm-feed-head {
            padding: 7px 9px;
            border-bottom: 1px solid rgba(34, 211, 238, 0.13);
            font-size: 8px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: rgba(167, 217, 235, 0.9);
          }
          #pkm-feed-list {
            max-height: 98px;
            overflow: hidden;
            padding: 5px 9px 7px;
            display: flex;
            flex-direction: column;
            gap: 4px;
          }
          .pkm-feed-item {
            font-size: 9px;
            letter-spacing: .08em;
            color: rgba(190, 240, 252, 0.92);
            transform: translateY(7px);
            opacity: 0;
            animation: pkm-feed-in .32s ease forwards;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
          }
          .pkm-feed-item.dim { opacity: .38; }
          @keyframes pkm-feed-in {
            to { transform: translateY(0); opacity: .95; }
          }

          .pkm-diag {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 0 12px 10px;
            padding: 7px 8px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            background: linear-gradient(130deg, rgba(18, 12, 36, 0.5), rgba(3, 16, 34, 0.62));
            opacity: .78;
            transition: opacity .3s ease;
          }
          #pkm-net-hud:hover .pkm-diag { opacity: 1; }
          .pkm-diag p {
            margin: 0;
            font-size: 8px;
            letter-spacing: .1em;
            color: rgba(196, 226, 240, 0.92);
            text-transform: uppercase;
          }
          .pkm-diag .vv {
            color: #d4f7ff;
            font-weight: 700;
          }

          .pkm-net-scan {
            position: absolute;
            left: 0;
            right: 0;
            top: 44px;
            height: 1px;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.82), transparent);
            animation: pkm-net-scan 2.7s ease-in-out infinite;
            z-index: 3;
          }
          @keyframes pkm-net-scan {
            0%, 100% { transform: translateY(0); opacity: .22; }
            50% { transform: translateY(288px); opacity: .62; }
          }

          body.pkm-telemetry-spike .pkm-v3-cg {
            transform: translate(-50%, -50%) scale(1.1);
            filter: saturate(1.18);
          }
          body.pkm-telemetry-spike .pkm-v3-sl {
            opacity: .86;
          }

          @media (max-width: 960px) {
            #pkm-net-hud {
              width: min(330px, calc(100vw - 20px));
              top: 62px;
              right: 10px;
            }
            .pkm-diag { grid-template-columns: 1fr; }
          }

          @media (max-width: 640px) {
            #pkm-net-hud {
              width: calc(100vw - 12px);
              top: 56px;
              right: 6px;
              border-radius: 12px;
            }
            .pkm-net-grid {
              grid-template-columns: 1fr 1fr;
              gap: 6px;
            }
            .pkm-metric {
              min-height: 52px;
              padding: 7px;
            }
            .pkm-metric .v {
              font-size: 15px;
            }
            #pkm-net-canvas {
              height: 68px;
            }
            #pkm-feed-list {
              max-height: 66px;
            }
            .pkm-diag {
              display: none;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            #pkm-net-hud::before,
            .pkm-node-dot,
            .pkm-net-scan,
            .pkm-feed-item,
            .pkm-metric .v,
            body.pkm-telemetry-spike .pkm-v3-cg {
              animation: none !important;
              transition: none !important;
            }
          }
        `

        const style = document.createElement('style')
        style.id = 'pkm-net-hud-css'
        style.textContent = css
        document.head.appendChild(style)

        if (!document.getElementById('pkm-net-hud')) {
          const hud = document.createElement('aside')
          hud.id = 'pkm-net-hud'
          hud.setAttribute('aria-label', 'Global Signal Network Telemetry')
          hud.innerHTML = [
            '<div class="pkm-net-head">',
            '<span class="label">GLOBAL SIGNAL NETWORK</span>',
            '<span class="pkm-node-status"><span class="pkm-node-dot"></span>NODE STATUS: ACTIVE</span>',
            '</div>',
            '<div class="pkm-net-grid">',
            '<div class="pkm-metric"><span class="k">ACTIVE IMPRESSIONS</span><span class="v" id="pkm-m-impressions">18,204</span></div>',
            '<div class="pkm-metric"><span class="k">LIVE CONNECTIONS</span><span class="v" id="pkm-m-live">12</span></div>',
            '<div class="pkm-metric"><span class="k">RETURNING VISITORS</span><span class="v" id="pkm-m-return">34<span class="u">%</span></span></div>',
            '<div class="pkm-metric"><span class="k">SYSTEM STATUS</span><span class="v" id="pkm-m-status">ONLINE</span></div>',
            '</div>',
            '<div class="pkm-net-viz-wrap"><canvas id="pkm-net-canvas" width="320" height="88"></canvas></div>',
            '<div class="pkm-feed">',
            '<div class="pkm-feed-head">VISITOR SIGNAL FEED</div>',
            '<div id="pkm-feed-list"></div>',
            '</div>',
            '<div class="pkm-diag">',
            '<p>Render FPS: <span class="vv" id="pkm-d-fps">120</span></p>',
            '<p>System Latency: <span class="vv" id="pkm-d-lat">12ms</span></p>',
            '<p>Node Response: <span class="vv" id="pkm-d-resp">99.2%</span></p>',
            '<p>Signal Uptime: <span class="vv" id="pkm-d-up">STABLE</span></p>',
            '</div>',
            '<div class="pkm-net-scan"></div>'
          ].join('')
          document.body.appendChild(hud)
        }

        const q = (id) => document.getElementById(id)
        const hud = q('pkm-net-hud')
        const impressionsEl = q('pkm-m-impressions')
        const liveEl = q('pkm-m-live')
        const returnEl = q('pkm-m-return')
        const feedEl = q('pkm-feed-list')
        const fpsEl = q('pkm-d-fps')
        const latEl = q('pkm-d-lat')
        const respEl = q('pkm-d-resp')

        const regions = ['HARARE', 'JOHANNESBURG', 'UK', 'BOTSWANA', 'NAIROBI', 'LUSAKA', 'CAPE TOWN', 'DAR ES SALAAM']
        const feedVerbs = ['NEW SIGNAL', 'NODE CONNECTED', 'RETURN CONNECTION', 'SESSION LINKED', 'ROUTE VERIFIED']

        const state = {
          impressions: 18204,
          live: 12,
          returning: 34,
          fps: 120,
          latency: 12,
          response: 99.2
        }

        function formatNumber(n) {
          return Math.round(n).toLocaleString('en-US')
        }

        function animateValue(el, from, to, duration, formatter) {
          if (!el) return
          if (prefersReducedMotion) {
            el.textContent = formatter(to)
            return
          }
          const start = performance.now()
          const ease = (t) => 1 - Math.pow(1 - t, 3)
          function frame(now) {
            const p = Math.min(1, (now - start) / duration)
            const v = from + (to - from) * ease(p)
            el.textContent = formatter(v)
            if (p < 1) requestAnimationFrame(frame)
          }
          requestAnimationFrame(frame)
        }

        function flashMetric(el) {
          if (!el) return
          el.classList.add('live')
          setTimeout(() => el.classList.remove('live'), 280)
        }

        function pulseEnvironment() {
          document.body.classList.add('pkm-telemetry-spike')
          setTimeout(() => document.body.classList.remove('pkm-telemetry-spike'), 450)
        }

        function addFeed(message) {
          if (!feedEl) return
          const item = document.createElement('div')
          item.className = 'pkm-feed-item'
          item.textContent = message
          feedEl.prepend(item)
          const items = feedEl.querySelectorAll('.pkm-feed-item')
          items.forEach((n, i) => {
            n.classList.toggle('dim', i > 2)
          })
          while (feedEl.children.length > 6) {
            feedEl.removeChild(feedEl.lastElementChild)
          }
        }

        function randomFeedEvent() {
          const verb = feedVerbs[Math.floor(Math.random() * feedVerbs.length)]
          const region = regions[Math.floor(Math.random() * regions.length)]
          addFeed(verb + ' - ' + region)
        }

        function tickMetrics() {
          const oldImpressions = state.impressions
          const oldLive = state.live
          const oldReturning = state.returning

          state.impressions += Math.random() < 0.72 ? (1 + Math.floor(Math.random() * 3)) : 0
          state.live = Math.max(6, Math.min(48, state.live + (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.45 ? 1 : 0)))
          state.returning = Math.max(22, Math.min(61, state.returning + (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.3 ? 1 : 0)))

          if (state.impressions !== oldImpressions) {
            animateValue(impressionsEl, oldImpressions, state.impressions, 560, formatNumber)
            flashMetric(impressionsEl)
            pulseEnvironment()
          }
          if (state.live !== oldLive) {
            animateValue(liveEl, oldLive, state.live, 420, (v) => String(Math.round(v)))
            flashMetric(liveEl)
          }
          if (state.returning !== oldReturning) {
            animateValue(returnEl, oldReturning, state.returning, 440, (v) => String(Math.round(v)) + '%')
            flashMetric(returnEl)
          }

          state.fps = Math.max(90, Math.min(165, state.fps + (Math.random() * 12 - 6)))
          state.latency = Math.max(8, Math.min(42, state.latency + (Math.random() * 4 - 2)))
          state.response = Math.max(97.6, Math.min(99.9, state.response + (Math.random() * 0.4 - 0.2)))

          if (fpsEl) fpsEl.textContent = String(Math.round(state.fps))
          if (latEl) latEl.textContent = String(Math.round(state.latency)) + 'ms'
          if (respEl) respEl.textContent = state.response.toFixed(1) + '%'

          if (Math.random() < 0.68) randomFeedEvent()
        }

        function setupViz() {
          const canvas = q('pkm-net-canvas')
          if (!canvas) return
          const ctx = canvas.getContext('2d')
          if (!ctx) return

          const dpr = Math.min(window.devicePixelRatio || 1, 2)
          const resize = () => {
            const w = canvas.clientWidth || 320
            const h = canvas.clientHeight || 88
            canvas.width = Math.floor(w * dpr)
            canvas.height = Math.floor(h * dpr)
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
          }
          resize()
          window.addEventListener('resize', resize)

          const nodes = Array.from({ length: 10 }, () => ({
            x: 8 + Math.random() * 300,
            y: 8 + Math.random() * 72,
            r: 1.8 + Math.random() * 2.3,
            phase: Math.random() * Math.PI * 2
          }))
          const links = []
          for (let i = 0; i < nodes.length - 1; i++) {
            links.push([i, i + 1])
            if (i + 2 < nodes.length && Math.random() < 0.5) links.push([i, i + 2])
          }
          let t = 0

          function draw() {
            t += prefersReducedMotion ? 0.015 : 0.028
            const w = canvas.clientWidth || 320
            const h = canvas.clientHeight || 88
            ctx.clearRect(0, 0, w, h)

            ctx.fillStyle = 'rgba(6, 14, 28, .6)'
            ctx.fillRect(0, 0, w, h)

            ctx.strokeStyle = 'rgba(34, 211, 238, .22)'
            ctx.lineWidth = 1
            links.forEach(([a, b], i) => {
              const n1 = nodes[a]
              const n2 = nodes[b]
              ctx.globalAlpha = 0.3 + 0.35 * Math.sin(t * 1.8 + i)
              ctx.beginPath()
              ctx.moveTo(n1.x, n1.y)
              ctx.lineTo(n2.x, n2.y)
              ctx.stroke()
            })

            nodes.forEach((n, i) => {
              const pulse = 0.35 + 0.65 * Math.abs(Math.sin(t * 2.2 + n.phase))
              ctx.globalAlpha = .95
              ctx.fillStyle = i % 4 === 0 ? 'rgba(139, 92, 246, .95)' : 'rgba(34, 211, 238, .95)'
              ctx.beginPath()
              ctx.arc(n.x, n.y, n.r + pulse * 1.3, 0, Math.PI * 2)
              ctx.fill()
            })

            const waveX = ((t * 48) % (w + 42)) - 42
            const grad = ctx.createLinearGradient(waveX, 0, waveX + 42, 0)
            grad.addColorStop(0, 'rgba(34, 211, 238, 0)')
            grad.addColorStop(.5, 'rgba(34, 211, 238, .42)')
            grad.addColorStop(1, 'rgba(34, 211, 238, 0)')
            ctx.fillStyle = grad
            ctx.fillRect(0, 0, w, h)

            ctx.globalAlpha = 1
            if (!prefersReducedMotion) requestAnimationFrame(draw)
          }

          draw()
        }

        function setupSupabaseRealtime() {
          const cfg = window.__PKM_TELEMETRY || {}
          if (!cfg.url || !cfg.anonKey || !cfg.table) return

          const scriptId = 'pkm-supabase-js'
          const start = () => {
            if (!window.supabase || !window.supabase.createClient) return
            const client = window.supabase.createClient(cfg.url, cfg.anonKey)

            client
              .channel('pkm-telemetry-live')
              .on('postgres_changes', { event: 'INSERT', schema: 'public', table: cfg.table }, (payload) => {
                const row = payload && payload.new ? payload.new : {}
                if (typeof row.total_views === 'number') state.impressions = row.total_views
                if (typeof row.live_connections === 'number') state.live = row.live_connections
                if (typeof row.returning_rate === 'number') state.returning = Math.round(row.returning_rate)
                if (typeof row.region === 'string' && row.region) {
                  addFeed('SESSION LINKED - ' + row.region.toUpperCase())
                }
                if (impressionsEl) impressionsEl.textContent = formatNumber(state.impressions)
                if (liveEl) liveEl.textContent = String(state.live)
                if (returnEl) returnEl.textContent = String(state.returning) + '%'
                pulseEnvironment()
              })
              .subscribe()
          }

          if (window.supabase && window.supabase.createClient) {
            start()
            return
          }

          if (!document.getElementById(scriptId)) {
            const s = document.createElement('script')
            s.id = scriptId
            s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'
            s.async = true
            s.onload = start
            document.head.appendChild(s)
          }
        }

        if (impressionsEl) impressionsEl.textContent = formatNumber(state.impressions)
        if (liveEl) liveEl.textContent = String(state.live)
        if (returnEl) returnEl.textContent = String(state.returning) + '%'

        randomFeedEvent()
        randomFeedEvent()
        randomFeedEvent()

        setupViz()
        setupSupabaseRealtime()
        setInterval(tickMetrics, prefersReducedMotion ? 3200 : 1800)

        if (hud) {
          hud.addEventListener('mouseenter', () => document.body.classList.add('pkm-telemetry-spike'))
          hud.addEventListener('mouseleave', () => document.body.classList.remove('pkm-telemetry-spike'))

          let hudVisible = true
          setInterval(() => {
            hudVisible = !hudVisible
            hud.classList.toggle('pkm-net-hidden', !hudVisible)
          }, 30000)
        }
      })()
    </script>

  </body>
</html>
