    <script>
      (() => {
        if (window.__pkmLiteHudMounted) return
        window.__pkmLiteHudMounted = true

        const hud = document.createElement('aside')
        hud.setAttribute('aria-label', 'System HUD')
        hud.style.position = 'fixed'
        hud.style.right = '16px'
        hud.style.top = '16px'
        hud.style.zIndex = '70'
        hud.style.width = '220px'
        hud.style.padding = '10px 12px'
        hud.style.border = '1px solid rgba(56, 189, 248, 0.35)'
        hud.style.borderRadius = '12px'
        hud.style.background = 'rgba(2, 6, 23, 0.82)'
        hud.style.backdropFilter = 'blur(8px)'
        hud.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace'
        hud.style.fontSize = '11px'
        hud.style.lineHeight = '1.5'
        hud.style.color = 'rgba(186, 230, 253, 0.95)'
        hud.style.pointerEvents = 'none'

        const title = document.createElement('div')
        title.textContent = 'SYSTEM HUD'
        title.style.fontWeight = '700'
        title.style.letterSpacing = '0.08em'
        title.style.marginBottom = '6px'
        title.style.color = 'rgba(125, 211, 252, 1)'

        const body = document.createElement('div')
        body.style.whiteSpace = 'pre-line'
        body.textContent = 'Loading telemetry...'

        hud.appendChild(title)
        hud.appendChild(body)
        document.body.appendChild(hud)

        let frameCount = 0
        let lastFrameTime = performance.now()
        let fps = 0

        const rafLoop = () => {
          frameCount += 1
          const now = performance.now()
          if (now - lastFrameTime >= 1000) {
            fps = Math.round((frameCount * 1000) / (now - lastFrameTime))
            frameCount = 0
            lastFrameTime = now
          }
          requestAnimationFrame(rafLoop)
        }
        requestAnimationFrame(rafLoop)

        const pickValue = (label) => {
          const match = document.body.innerText.match(new RegExp(`${label}\\s*:\\s*([^\\n]+)`))
          return match ? match[1].trim() : 'N/A'
        }

        const updateHud = () => {
          body.textContent = [
            `Node: ${pickValue('ACTIVE NODE')}`,
            `Mode: ${pickValue('CURRENT MODE')}`,
            `Uptime: ${pickValue('UPTIME')}`,
            `FPS: ${fps || 'N/A'}`,
          ].join('\n')
        }

        updateHud()
        setInterval(updateHud, 1200)
      })()
    </script>

        /* â”€â”€ PREVIEW HTML â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        function buildPreview(p) {
          const bars = Array.from({length:10}).map(()=>'<div class="pkm-bar"></div>').join('')
          if (p.preview==='bars') return `
            <div class="pkm-preview-grid"></div>
            <span class="pkm-preview-lbl">${p.pvLabel}</span>
            <span class="pkm-preview-val" data-metric="${Math.floor(Math.random()*35+55)}">â€”</span>
            <div class="pkm-bars">${bars}</div>`
          if (p.preview==='pulse') return `
            <div class="pkm-preview-grid"></div>
            <span class="pkm-preview-lbl">${p.pvLabel}</span>
            <span class="pkm-preview-val">LIVE</span>
            <div class="pkm-pulse-wrap">
              <svg class="pkm-ecg-svg" viewBox="0 0 320 38" fill="none">
                <polyline stroke="${p.glow}" stroke-width="1.5" fill="none" opacity=".85" stroke-dasharray="600" class="pkm-ecg-path"
                  points="0,19 25,19 38,5 50,33 60,19 90,19 103,2 115,36 125,19 155,19 168,5 180,33 190,19 220,19 233,3 245,35 255,19 285,19 298,4 310,34 320,19"/>
              </svg>
            </div>
            <div class="pkm-pulse-dot" style="background:${p.glow};box-shadow:0 0 8px ${p.glow}"></div>`
          if (p.preview==='scan') {
            const dots = Array.from({length:14}).map(()=>{
              const x=(Math.random()*78+8).toFixed(1),y=(Math.random()*55+20).toFixed(1),d=(Math.random()*1.4).toFixed(2)
              return `<div class="pkm-scan-dot" style="left:${x}%;top:${y}%;animation-delay:${d}s;background:${p.glow};box-shadow:0 0 6px ${p.glow}"></div>`
            }).join('')
            return `
              <div class="pkm-preview-grid"></div>
              <span class="pkm-preview-lbl">${p.pvLabel}</span>
              <span class="pkm-preview-val">SCANNING</span>
              <div class="pkm-scan-area">${dots}<div class="pkm-scan-sweep" style="background:linear-gradient(to bottom,transparent,${p.glow}44,transparent)"></div></div>`
          }
          const flines = Array.from({length:4}).map((_,i)=>`<div class="pkm-flow-line" style="top:${20+i*18}%;width:${40+Math.random()*35}%;animation-delay:${(i*.45).toFixed(2)}s;background:linear-gradient(to right,${p.glow}88,transparent)"></div>`).join('')
          return `
            <div class="pkm-preview-grid"></div>
            <span class="pkm-preview-lbl">${p.pvLabel}</span>
            <span class="pkm-preview-val">ACTIVE</span>
            <div class="pkm-flow-area">${flines}</div>`
        }

        /* â”€â”€ CARD BUILDER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        function buildCard(p, i) {
          const art = document.createElement('article')
          art.className = 'pkm-project-card ' + p.anim + (p.featured ? ' pkm-featured' : '')
          art.style.cssText = '--cg:' + p.glow + ';--cgd:' + p.glowDim + ';'
          art.dataset.delay = String(i * 130)
          const hl = p.highlights.map(h => '<li>' + h + '</li>').join('')
          const chips = p.stack.map(t => '<span class="pkm-chip">' + t + '</span>').join('')
          art.innerHTML =
            '<div class="pkm-card-ambient"></div>' +
            '<div class="pkm-card-glass"></div>' +
            '<div class="pkm-hover-glow"></div>' +
            '<div class="pkm-card-border-sweep"></div>' +
            '<div class="pkm-card-content">' +
              '<div class="pkm-card-toprow">' +
                '<span class="pkm-card-idx">// ' + p.idx + '</span>' +
                '<span class="pkm-card-badge">' + p.domain + '</span>' +
              '</div>' +
              '<h3 class="pkm-card-title">' + p.title + '</h3>' +
              '<p class="pkm-card-stage">' + p.stage + '</p>' +
              '<div class="pkm-preview">' + buildPreview(p) + '</div>' +
              '<p class="pkm-card-summary">' + p.summary + '</p>' +
              '<ul class="pkm-hl">' + hl + '</ul>' +
              '<div class="pkm-chips">' + chips + '</div>' +
              '<button class="pkm-openbtn" type="button">Open System ' +
                '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5h6M5.5 2.5L8 5l-2.5 2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
              '</button>' +
            '</div>'
          art.addEventListener('mousemove', function(e) {
            const r = art.getBoundingClientRect()
            art.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%')
            art.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%')
          })
          art.querySelector('.pkm-openbtn').addEventListener('click', function(ev) { ev.stopPropagation(); openModal(p) })
          art.addEventListener('click', function() { openModal(p) })
          const mv = art.querySelector('[data-metric]')
          if (mv) {
            const tgt = parseInt(mv.dataset.metric); let cur = 0
            const tick = function() { cur = Math.min(cur + Math.ceil(tgt / 36), tgt); mv.textContent = cur + '%'; if (cur < tgt) requestAnimationFrame(tick) }
            setTimeout(tick, 900 + i * 130)
          }
          return art
        }

        /* â”€â”€ MODAL â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        let _modal = null
        function ensureModal() {
          if (document.getElementById('pkm-modal')) { _modal = document.getElementById('pkm-modal'); return }
          _modal = document.createElement('div'); _modal.id = 'pkm-modal'
          _modal.innerHTML = '<div id="pkm-modal-bg"></div><div id="pkm-modal-box"><button id="pkm-modal-close" type="button" aria-label="Close">\u2715</button><div id="pkm-modal-body"></div></div>'
          document.body.appendChild(_modal)
          document.getElementById('pkm-modal-bg').addEventListener('click', closeModal)
          document.getElementById('pkm-modal-close').addEventListener('click', closeModal)
          document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal() })
        }
        function openModal(p) {
          ensureModal()
          document.getElementById('pkm-modal-box').style.borderColor = p.glow + '44'
          const hl = p.highlights.map(h => '<li>' + h + '</li>').join('')
          const chips = p.stack.map(t => '<span class="mm-chip" style="border-color:' + p.glow + '44;color:' + p.glow + ';background:' + p.glowDim + '">' + t + '</span>').join('')
          document.getElementById('pkm-modal-body').innerHTML =
            '<span class="mm-badge" style="border-color:' + p.glow + '44;color:' + p.glow + ';background:' + p.glowDim + '">' + p.domain + '</span>' +
            '<h2 class="mm-title">' + p.title + '</h2>' +
            '<p class="mm-stage">' + p.stage + '</p>' +
            '<div class="mm-div"></div>' +
            '<p class="mm-summary">' + p.summary + '</p>' +
            '<p class="mm-hl-label">System Capabilities</p>' +
            '<ul class="mm-hl" style="--mg:' + p.glow + '">' + hl + '</ul>' +
            '<div class="mm-chips">' + chips + '</div>'
          requestAnimationFrame(function() { requestAnimationFrame(function() { _modal.classList.add('open') }) })
          document.body.style.overflow = 'hidden'
        }
        function closeModal() {
          if (_modal) _modal.classList.remove('open')
          document.body.style.overflow = ''
        }

        /* â”€â”€ VISIBILITY GUARD â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        function forceProjectsVisible() {
          const section = document.getElementById('projects')
          if (section) {
            section.style.setProperty('opacity', '1', 'important')
            section.style.setProperty('transform', 'none', 'important')
          }
          document.querySelectorAll('.pkm-project-card').forEach(function(card) {
            card.style.setProperty('opacity', '1', 'important')
            card.style.setProperty('transform', 'none')
          })
        }

        /* â”€â”€ PATCH â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        let patched = false
        function applyPatch() {
          if (patched) return true
          const section = document.getElementById('projects')
          if (!section) return false
          const origCards = Array.from(section.querySelectorAll('article')).filter(function(a) { return !!a.querySelector('h3') })
          if (!origCards.length) return false
          patched = true
          origCards.forEach(function(a) { a.style.display = 'none' })
          /* Force section visible â€” Framer Motion may hold it at opacity:0 until its own observer fires */
          forceProjectsVisible()
          const old = section.querySelector('[data-pkm-grid]')
          if (old) old.remove()
          const grid = document.createElement('div')
          grid.setAttribute('data-pkm-grid', 'true')
          grid.className = 'pkm-projects-grid'
          portfolioProjects.forEach(function(p, i) { grid.appendChild(buildCard(p, i)) })
          section.appendChild(grid)
          ensureModal()
          const io = new IntersectionObserver(function(entries) {
            entries.forEach(function(e) {
              if (!e.isIntersecting) return
              const card = e.target, d = parseInt(card.dataset.delay || '0')
              setTimeout(function() { card.classList.add('pkm-on') }, d)
              io.unobserve(card)
            })
          }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' })
          const allCards = Array.from(grid.querySelectorAll('.pkm-project-card'))
          allCards.forEach(function(c) { io.observe(c) })
          /* Fallback: if observer never fires (cards already in viewport at mount), reveal after delay */
          setTimeout(function() {
            allCards.forEach(function(c) {
              if (!c.classList.contains('pkm-on')) {
                c.classList.add('pkm-on')
              }
            })
            forceProjectsVisible()
          }, 600)
          return true
        }

        /* â”€â”€ BOOT â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
        let tries = 0
        const t = setInterval(function() {
          tries++
          applyPatch()
          forceProjectsVisible()
          if (tries > 120) clearInterval(t)
        }, 250)
        window.addEventListener('load', function() {
          applyPatch()
          forceProjectsVisible()
        })
        new MutationObserver(function() {
          if (!patched) applyPatch()
          forceProjectsVisible()
        }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class'] })
      })()
    </script>

    <script>
      (() => {
        if (window.__pkmNameSpacingPatched) return
        window.__pkmNameSpacingPatched = true

        const targetName = 'Prince K Mhizha'
        const normalize = () => {
          const nodes = document.querySelectorAll('h1, h2, h3, a, p, span, div')
          nodes.forEach((node) => {
            const txt = (node.textContent || '').replace(/\s+/g, ' ').trim()
            if (txt === targetName) {
              node.style.setProperty('letter-spacing', 'normal', 'important')
              node.style.setProperty('word-spacing', 'normal', 'important')
              node.style.setProperty('white-space', 'normal', 'important')
            }
          })
        }

        normalize()
        window.addEventListener('load', normalize)
        new MutationObserver(normalize).observe(document.body, { childList: true, subtree: true, characterData: true })
      })()
    </script>

          .pkm-v3-corner.tl::after  { top: 0; left: 0; }
          .pkm-v3-corner.tr { top: 0; right: 0; }
          .pkm-v3-corner.tr::before { top: 0; right: 0; left: auto; }
          .pkm-v3-corner.tr::after  { top: 0; right: 0; left: auto; }
          .pkm-v3-corner.bl { bottom: 0; left: 0; }
          .pkm-v3-corner.bl::before { bottom: 0; top: auto; left: 0; }
          .pkm-v3-corner.bl::after  { bottom: 0; top: auto; left: 0; }

          /* ── HOLOGRAPHIC SHIMMER ON HERO SECTION ───────────────────────── */
          .pkm-v3-shimmer {
            position: absolute;
            inset: 0; pointer-events: none; z-index: 0;
            background: linear-gradient(
              135deg,
              transparent 30%,
              rgba(139,92,246,.028) 50%,
              transparent 70%
            );
            background-size: 200% 200%;
            animation: pkm-v3-shim 10s ease-in-out infinite;
          }
          @keyframes pkm-v3-shim {
            0%,100% { background-position: 0% 0%; }
            50%      { background-position: 100% 100%; }
          }

          /* ── ENTRANCE FADE-UP CLASSES ───────────────────────────────────── */
          .pkm-v3-eu1 { animation: pkm-v3-eu .65s ease-out .05s both; }
          .pkm-v3-eu2 { animation: pkm-v3-eu .65s ease-out .22s both; }
          .pkm-v3-eu3 { animation: pkm-v3-eu .65s ease-out .40s both; }
          @keyframes pkm-v3-eu {
            from { opacity:0; transform:translateY(14px); filter:blur(3px); }
            to   { opacity:1; transform:none; filter:none; }
          }
        `

        const styleEl = document.createElement('style')
        styleEl.id = 'pkm-hero-v3-css'
        styleEl.textContent = CSS
        document.head.appendChild(styleEl)

        /* ── GLOBAL LAYERS (fire immediately) ──────────────────────────────── */

        // Scanlines
        if (!document.querySelector('.pkm-v3-sl')) {
          const sl = document.createElement('div')
          sl.className = 'pkm-v3-sl'
          document.body.insertBefore(sl, document.body.firstChild)
        }

        // Cursor ambient glow
        if (!document.getElementById('pkm-v3-cg')) {
          const cg = document.createElement('div')
          cg.id = 'pkm-v3-cg'
          document.body.appendChild(cg)
          document.addEventListener('mousemove', function (e) {
            cg.style.left = e.clientX + 'px'
            cg.style.top = e.clientY + 'px'
          }, { passive: true })
        }

        /* ── FLOATING TELEMETRY WIDGET ─────────────────────────────────────── */
        function addWidget () {
          if (document.querySelector('.pkm-v3-fw') || window.innerWidth < 900) return
          const bars = Array.from({ length: 14 }, function (_, i) {
            return '<div class="pkm-v3-gbar" style="height:' +
              (Math.random() * 62 + 12).toFixed(0) + '%;animation-delay:' +
              (i * 0.1).toFixed(1) + 's;animation-duration:' +
              (1.3 + Math.random() * 0.9).toFixed(1) + 's"></div>'
          }).join('')
          const w = document.createElement('div')
          w.className = 'pkm-v3-fw'
          w.style.cssText = 'right:216px;top:12px;'
          w.innerHTML =
            '<div class="pkm-v3-fw-hdr">TELEMETRY</div>' +
            '<div class="pkm-v3-fw-row"><span class="pkm-v3-fw-k">STATUS</span><span class="pkm-v3-fw-v ok">STABLE</span></div>' +
            '<div class="pkm-v3-fw-row"><span class="pkm-v3-fw-k">NODE SYNC</span><span class="pkm-v3-fw-v">98.7%</span></div>' +
            '<div class="pkm-v3-fw-row"><span class="pkm-v3-fw-k">PIPELINE</span><span class="pkm-v3-fw-v ok">ACTIVE</span></div>' +
            '<div class="pkm-v3-fw-row"><span class="pkm-v3-fw-k">SESSION</span><span class="pkm-v3-fw-v" id="pkm-v3-sess">00:00</span></div>' +
            '<div class="pkm-v3-fw-graph">' + bars + '</div>'
          document.body.appendChild(w)
          const t0 = Date.now()
          setInterval(function () {
            const el = document.getElementById('pkm-v3-sess')
            if (!el) return
            const d = Date.now() - t0
            el.textContent =
              String(Math.floor(d / 60000)).padStart(2, '0') + ':' +
              String(Math.floor((d % 60000) / 1000)).padStart(2, '0')
          }, 1000)
        }

        /* ── HUD GRAPH UPGRADE ─────────────────────────────────────────────── */
        function upgradeHud () {
          const hud = document.querySelector('aside[aria-label="System HUD"]')
          if (!hud || hud.dataset.v3u) return
          hud.dataset.v3u = '1'
          const bars = Array.from({ length: 14 }, function (_, i) {
            return '<div class="pkm-v3-gbar" style="height:' +
              (Math.random() * 55 + 18).toFixed(0) + '%;animation-delay:' +
              (i * 0.1).toFixed(1) + 's;"></div>'
          }).join('')
          const g = document.createElement('div')
          g.className = 'pkm-v3-hud-graph'
          g.innerHTML = bars
          hud.appendChild(g)
        }

        /* ── HERO PATCH ────────────────────────────────────────────────────── */
        let heroPatched = false

        function patchHero () {
          if (heroPatched) return
          const h1 = Array.from(document.querySelectorAll('h1')).find(function (el) {
            return /Prince.*Mhizha/i.test((el.textContent || '').replace(/\s+/g, ' '))
          })
          if (!h1) return
          heroPatched = true

          /* 1 · Holographic name gradient */
          h1.classList.add('pkm-h1-v3')

          const par = h1.parentElement
          if (!par) return
          par.style.position = 'relative'

          /* 2 · Ambient radial glow behind name */
          if (!par.querySelector('.pkm-v3-nglow')) {
            const gl = document.createElement('div')
            gl.className = 'pkm-v3-nglow'
            par.insertBefore(gl, par.firstChild)
          }

          /* 3 · Identity status badges above name */
          if (!par.querySelector('.pkm-v3-srow')) {
            const sr = document.createElement('div')
            sr.className = 'pkm-v3-srow pkm-v3-eu1'
            sr.innerHTML =
              '<div class="pkm-v3-badge bc"><span class="pkm-v3-dot dc"></span>Identity Interface</div>' +
              '<div class="pkm-v3-badge bg"><span class="pkm-v3-dot dg"></span>Systems Online</div>' +
              '<div class="pkm-v3-badge bv"><span class="pkm-v3-dot dv"></span>Node Active</div>'
            par.insertBefore(sr, h1)
          }

          /* 4 · Data meta row inserted after h1 */
          if (!par.querySelector('.pkm-v3-datarow')) {
            const dr = document.createElement('div')
            dr.className = 'pkm-v3-datarow pkm-v3-eu2'
            dr.innerHTML =
              '<div class="pkm-v3-ditem"><span class="pkm-v3-dot dc"></span>Frontend Systems</div>' +
              '<div class="pkm-v3-dsep"></div>' +
              '<div class="pkm-v3-ditem"><span class="pkm-v3-dot dg"></span>UX Architecture</div>' +
              '<div class="pkm-v3-dsep"></div>' +
              '<div class="pkm-v3-ditem"><span class="pkm-v3-dot dv"></span>Zimbabwe · Active</div>'
            h1.insertAdjacentElement('afterend', dr)
          }

          /* 5 · Animated border + shimmer on the cyber-card / header container */
          const cyberCard = h1.closest('[class*="cyber-card"]') || h1.closest('header') || h1.closest('section') || h1.closest('[class*="py-"]')
          if (cyberCard && cyberCard !== document.body) {
            if (getComputedStyle(cyberCard).position === 'static') {
              cyberCard.style.position = 'relative'
            }
            if (!cyberCard.querySelector('.pkm-v3-hborder')) {
              const hb = document.createElement('div'); hb.className = 'pkm-v3-hborder'
              const sh = document.createElement('div'); sh.className = 'pkm-v3-shimmer'
              cyberCard.appendChild(hb)
              cyberCard.appendChild(sh)
              ;['tl', 'tr', 'bl'].forEach(function (cls) {
                const c = document.createElement('div')
                c.className = 'pkm-v3-corner ' + cls
                cyberCard.appendChild(c)
              })
            }
          }

          /* 6 · Floating widget + HUD upgrade */
          addWidget()
          upgradeHud()
        }

        /* ── BOOT ──────────────────────────────────────────────────────────── */
        let tries = 0
        const bt = setInterval(function () {
          tries++
          patchHero()
          upgradeHud()
          if (heroPatched || tries > 120) clearInterval(bt)
        }, 250)
        window.addEventListener('load', function () { patchHero(); upgradeHud() })
        new MutationObserver(function () {
          if (!heroPatched) patchHero()
          upgradeHud()
        }).observe(document.body, { childList: true, subtree: true })
      })()
    </script>

    <script>
      (() => {
        if (window.__pkmTerminalCloseX) return
        window.__pkmTerminalCloseX = true

        if (!document.getElementById('pkm-terminal-close-css')) {
          const style = document.createElement('style')
          style.id = 'pkm-terminal-close-css'
          style.textContent =
            '[data-terminal] [aria-label="Close terminal"], [data-terminal] .pkm-terminal-close-x {' +
            'width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;' +
            'border:1px solid rgba(34,211,238,.35);border-radius:999px;background:rgba(2,6,23,.65);' +
            'color:rgba(103,232,249,.95);font-size:13px;line-height:1;font-weight:700;cursor:pointer;' +
            'transition:all .2s ease;flex-shrink:0;' +
            '}' +
            '[data-terminal] [aria-label="Close terminal"]:hover, [data-terminal] .pkm-terminal-close-x:hover {' +
            'background:rgba(8,47,73,.85);border-color:rgba(34,211,238,.7);color:#ecfeff;' +
            '}'
          document.head.appendChild(style)
        }

        function ensureCloseButton () {
          const terminal = document.querySelector('[data-terminal]')
          if (!terminal) return

          const header = terminal.querySelector('.mb-2.flex.items-center.justify-between') || terminal.firstElementChild
          if (!header) return

          const existing = terminal.querySelector('[aria-label="Close terminal"]')
          if (existing) {
            existing.textContent = 'X'
            existing.setAttribute('title', 'Close')
            return
          }

          if (terminal.querySelector('.pkm-terminal-close-x')) return

          const btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'pkm-terminal-close-x'
          btn.setAttribute('aria-label', 'Close terminal')
          btn.setAttribute('title', 'Close')
          btn.textContent = 'X'
          btn.addEventListener('click', function () {
            terminal.style.display = 'none'
          })
          header.appendChild(btn)
        }

        ensureCloseButton()
        window.addEventListener('load', ensureCloseButton)
        new MutationObserver(ensureCloseButton).observe(document.body, { childList: true, subtree: true })
      })()
    </script>

  </body>
</html>
